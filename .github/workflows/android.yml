# Builds the Android test app from main and publishes it as the
# "android-latest" release, which the site's download button points to.
name: Android test build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'supabase/**']
  workflow_dispatch:

concurrency:
  group: android-build
  # A running build finishes; newer pushes wait their turn.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Check
        run: |
          npm test
          npm run typecheck

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the app file
        working-directory: android
        # Signed with the project template's test key: fine for a test build, not for a store.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk assistlife.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest assistlife.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Android test build" \
            --notes "Test build of the Android app from commit $GITHUB_SHA. Not a store release."
